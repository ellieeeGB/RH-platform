name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Regression tests
        run: npm test

      - name: Build
        run: npm run build
